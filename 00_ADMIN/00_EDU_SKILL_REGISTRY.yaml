schema_version: 2
registry: "eduHarness Cloud Skill Registry"
namespace: "edu"
edition: "cloud"
status: "active"
runtime_ssot: true

runtime_targets:
  - chatgpt_web
  - gemini_spark

environment_contract:
  runtime_env_anchor: "00_EDUHARNESS_ENV.yaml"
  template: "00_EDUHARNESS_ENV_TEMPLATE.yaml"
  rule: >
    Registry 不保存個人 Drive root。Project 先讀正式 ENV，
    再由 ENV.workspace.registry 找到本 Registry。

source_contract:
  cloud_runtime_ssot: "Google Drive installation resolved from ENV"
  canonical_distribution_repository: "https://github.com/bai-collab/eduHarness_Nooa.git"
  legacy_code_repository: "https://github.com/bai-collab/eduHarness-.git"
  upstream_branch: "main"
  canonical_skill_root: "00_ADMIN/SKILLS"
  legacy_skill_root: "brain/skills"
  rule: >
    `eduHarness_Nooa` GitHub 是 Cloud Canonical Distribution；legacy `eduHarness-` 只保留 Code Edition provenance / 明確移植來源。
    Cloud Skill 保存各 installation 的 runtime 可執行版本；不要求與 legacy Code Skill 逐字相同，但相同能力優先保留相同 skill_id。

routing_policy:
  unknown_skill_action: "stop"
  preload_all_skills: false
  read_skill_full_text_before_execute: true
  relation_source: "registry-only"
  namespace_required: true
  typed_relations_required: true

graph_policy:
  canonical_reference:
    field: namespace_id
  requires:
    cycle_allowed: false
    missing_target_action: stop
  routing:
    cycle_allowed: conditional
    max_route_hops: 5
    repeated_node_state_action: stop
    omitted_evaluation_default: post_execution
  conflicts:
    simultaneous_activation: forbidden
  supports:
    auto_load: false
  replaces:
    replacement_cycle_allowed: false

reasoning_policy:
  mode: conditional
  kernel_skill: "edu:reasoning-kernel"
  activation:
    - "存在兩個以上合理假設、方案或解釋，需要區分"
    - "來源衝突、證據強度不同或關鍵資訊不完整"
    - "診斷、除錯、研究、策略、因果判斷或高成本決策"
    - "需要反例、測試、實驗或查證才能提高信心"
  bypass:
    - "單純抄錄、翻譯、格式轉換或明確規則下的機械操作"
    - "單一可靠來源即可回答的簡單事實查詢"
  integration_rule: >
    先依 Registry selection 選擇 provisional Primary Skill；entry route 收斂後確認 Primary Skill。
    符合 activation 時可用 enhances 載入 reasoning-kernel 作為 supporting capability；
    reasoning-kernel 不得覆蓋 Primary Skill 的 domain rules、output contract、Human Gate 或 stopping rule。
  output_rule: >
    只保留可稽核的 evidence / hypothesis / check / result / conclusion 紀錄；
    不要求、保存或輸出模型私有 chain-of-thought。

skill_port_policy:
  meta_skill: "github-to-cloud-skill-port"
  port_mode: "functional-adaptation"
  blind_mirror_allowed: false
  auto_batch_sync_allowed: false
  auto_overwrite_allowed: false
  update_registry_after_success: true
  update_brain_index_for_skill_only: false
  portability_verification_required: true
  installation_specific_drive_locator_allowed_outside_env: false
  skill_package_unit: "folder"
  preserve_required_subresources: true
  package_verification: "SKILL.md + referenced references/templates/assets/other required files"

skills:
  - id: "cloud-bootstrap"
    namespace_id: "edu:cloud-bootstrap"
    canonical_name: "eduHarness Cloud 初始化"
    file: "00_ADMIN/SKILLS/_META/cloud-bootstrap/SKILL.md"
    metadata:
      type: meta
      role: primary-capability
      purpose: >
        初始化、從官方 GitHub Distribution 安裝、搬移或修復 eduHarness Cloud installation；
        教師提供自己的 Drive root，建立標準 Drive 架構、正式 ENV、Registry、Brain Index 與必要 meta skills。
    selection:
      triggers: ["初始化 eduHarness Cloud", "安裝 eduHarness Cloud", "安裝 eduHarness_Nooa", "從 Distribution 安裝 eduHarness", "建立 eduHarness Cloud 架構", "依模板建立 ENV", "搬移 eduHarness Cloud", "修復 eduHarness Cloud bootstrap"]
      excludes: ["一般教案撰寫", "一般命題", "一般教材製作", "一般文獻查詢"]
    relations: {requires: [], enhances: [], routes: [], conflicts: [], replaces: [], supports: []}
    constraints:
      human_gate_if: ["覆寫既有 ENV", "覆寫既有 Registry 或 Brain Index", "批次搬移或刪除資料"]

  - id: "github-to-cloud-skill-port"
    namespace_id: "edu:github-to-cloud-skill-port"
    canonical_name: "GitHub → Cloud Skill 移植"
    file: "00_ADMIN/SKILLS/_META/github-to-cloud-skill-port/SKILL.md"
    metadata:
      type: meta
      role: primary-capability
      purpose: >
        預設從 `eduHarness_Nooa` Canonical Distribution 同步指定 Skill；若使用者明確指定 legacy Code Edition，
        則做 functional adaptation 後移植到 Google Drive Cloud Edition，並針對 ChatGPT Web / Gemini Spark runtime 重新適配。
    selection:
      triggers: ["同步 GitHub skill", "複製 GitHub skill 到 Drive", "移植 eduHarness skill", "更新 Cloud skill", "檢查 GitHub skill 是否有新版"]
      excludes: ["一般教案撰寫", "一般命題", "一般教材製作", "一般文獻查詢"]
    relations: {requires: [], enhances: [], routes: [], conflicts: [], replaces: [], supports: []}
    constraints:
      human_gate_if: ["批次同步", "覆寫既有 Cloud Skill 的重大流程", "刪除或重新命名 Skill"]
    runtime:
      chatgpt_web: "preferred-for-porting-when-github-connector-available"
      gemini_spark: "consume-cloud-result; upstream-porting requires equivalent GitHub access"


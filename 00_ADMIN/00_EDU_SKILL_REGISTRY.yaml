schema_version: 3
registry_kind: "eduharness-official-registry"
registry: "eduHarness Official Skill Registry"
namespace: "edu"
edition: "cloud"
status: "active"
authority: "canonical_distribution"
mutability: "read_only"
runtime_ssot: false
distribution_revision: "2026-08-13-registry-v3"

runtime_targets: [chatgpt_web, gemini_spark]

authority_contract:
  official_registry: "GitHub Canonical Distribution pinned to one immutable commit snapshot per execution"
  local_registry: "installation-owned overlay resolved from formal ENV.control_plane.local_registry"
  effective_routing_view: "runtime ephemeral; never a persistent third Registry"
  precedence: "Project governance > Local explicit policy > Official Registry > Skill self-routing"
  project_governance_override_allowed: false

environment_contract:
  installation_entry: "Bootstrap Descriptor"
  env_template: "00_EDUHARNESS_ENV_TEMPLATE.yaml"
  local_registry_locator_field: "ENV.control_plane.local_registry"
  rule: "Official Registry 不保存 installation-specific provider locator；Descriptor→ENV 只解析 installation-owned Local Registry/Brain Index/Artifact Index/Storage。Official Registry 由 Project upstream pin 到 immutable Distribution snapshot 後讀取。"

source_contract:
  official_source: "project_upstream"
  snapshot_required: true
  snapshot_identity: "immutable_commit_sha"
  snapshot_scope: "Official Registry + Official Skills + Official Knowledge used in the same execution"
  canonical_skill_root: "00_ADMIN/SKILLS"
  official_artifact_resolution: "pinned distribution snapshot + canonical path"
  installation_artifact_index_for_official_required: false
  local_artifact_resolution: "Local Registry logical artifact:// ID → installation Artifact Index → provider stable identity/revision"

local_overlay_contract:
  supported: true
  local_registry_schema: 1
  overlay_contract_version: 1
  namespace: "local"
  implicit_override_allowed: false
  official_id_reuse_allowed: false
  official_namespace_impersonation_allowed: false
  official_to_local_authored_relation_allowed: false
  local_to_official_relation_allowed: true
  local_to_local_relation_allowed: true
  conflict_action: stop
  contract_ref: "docs/LOCAL_REGISTRY_CONTRACT.md"
  dual_layer_contract_ref: "docs/REGISTRY_V3_DUAL_LAYER_CONTRACT.md"
  resolver_fixtures_ref: "00_ADMIN/REGISTRY_V3_RESOLVER_FIXTURES.yaml"

routing_policy:
  unknown_skill_action: stop
  preload_all_skills: false
  read_skill_full_text_before_execute: true
  relation_source: registry-layered
  namespace_required: true
  typed_relations_required: true
  routing_guard_contract_version: "2.1"
  guard_truth_values: [TRUE, FALSE, UNKNOWN]
  automatic_handoff_requires: TRUE
  unknown_action: keep_current_primary_and_emit_diagnostic
  false_action: keep_current_primary
  confirmed_required_for_boolean_resolution: true
  inferred_evaluates_as: UNKNOWN
  conflict_evaluates_as: UNKNOWN
  missing_never_becomes_false: true
  operators_enabled: [all, any, equals, in, exists]
  not_operator_enabled: false
  per_route_on_unknown_enabled: false
  confidence_score_enabled: false
  state_builder_ref: "00_ADMIN/REGISTRY_V2_1_RUNTIME_STATE_BUILDER.yaml"
  effective_order: [selection, entry_routes, primary_confirmation, requires, enhances, execute, post_execution_routes, verify]

observability_policy:
  audit_trace_contract_ref: "00_ADMIN/REGISTRY_V2_1_RUNTIME_AUDIT_TRACE_CONTRACT.yaml"
  trace_adapter_ref: "00_ADMIN/REGISTRY_V2_1_RUNTIME_TRACE_ADAPTER.yaml"
  trace_assembly_owner: runtime_orchestrator
  trace_default_persistence: ephemeral
  trace_persist_destination: "ENV.storage.work_area"
  provenance_required: [namespace_id, scope, source_registry, source_identity]
  private_chain_of_thought_storage: prohibited
  student_pii_storage: prohibited

routing_key_points:
  source.lesson.exists: {type: boolean}
  source.lesson.type: {type: string}
  source.material.exists: {type: boolean}
  source.quest_spec.exists: {type: boolean}
  source.image.exists: {type: boolean}
  source.image.single: {type: boolean}
  source.web_game.exists: {type: boolean, semantic_name: existing_web_game_baseline_exists}
  source.conjecturing_lesson.ready: {type: boolean}
  task.intent:
    type: enum
    allowed_values: [lesson_plan_authoring, lesson_differentiation, item_authoring, quest_game_design, student_facilitation, conjecturing_lesson_design, threejs_adoption, image_to_3d_scene, visual_art_design, storyboard_design]
  output.complete_lesson_plan: {type: boolean}
  output.game_spec: {type: boolean}
  output.web_implementation: {type: boolean}

graph_policy:
  canonical_reference: {field: namespace_id}
  requires: {cycle_allowed: false, missing_target_action: stop}
  routing: {cycle_allowed: conditional, max_route_hops: 5, repeated_node_state_action: stop, omitted_evaluation_default: post_execution}
  conflicts: {simultaneous_activation: forbidden}
  supports: {auto_load: false}
  replaces: {replacement_cycle_allowed: false}
  cross_layer:
    official_to_official: allowed
    local_to_official: allowed
    local_to_local: allowed
    official_to_local: forbidden

reasoning_policy:
  mode: conditional
  kernel_skill: "edu:reasoning-kernel"
  activation:
    - "存在兩個以上合理假設、方案或解釋，需要區分"
    - "來源衝突、證據強度不同或關鍵資訊不完整"
    - "診斷、除錯、研究、策略、因果判斷或高成本決策"
    - "需要反例、測試、實驗或查證才能提高信心"
  bypass:
    - "單純抄錄、翻譯、格式轉換或明確規則下的機械操作"
    - "單一可靠來源即可回答的簡單事實查詢"
  integration_rule: "entry route 收斂後確認 Primary；reasoning-kernel 只能作 supporting capability，不得覆蓋 Primary Skill 的 domain/output/Human Gate/stopping contract。"
  output_rule: "只保留可稽核 evidence/hypothesis/check/result/conclusion；不得保存或輸出 private chain-of-thought。"

skill_lifecycle_policy:
  official_skill_change: "Canonical Distribution change; requires routing/portability validation and promotion gate."
  local_skill_creation: "Owned by Local Registry + installation Artifact Index; does not modify this Official Registry."
  legacy_github_to_cloud_port:
    status: legacy_migration_support
    fresh_install_official_mirror_required: false
    blind_mirror_allowed: false
    model_regeneration_as_transport_allowed: false

skills:
  - id: cloud-bootstrap
    namespace_id: "edu:cloud-bootstrap"
    canonical_name: "eduHarness Cloud 初始化"
    artifact: {source: distribution, path: "00_ADMIN/SKILLS/_META/cloud-bootstrap/SKILL.md"}
    metadata: {type: meta, role: primary-capability}
    selection:
      triggers: ["初始化 eduHarness Cloud", "安裝 eduHarness Cloud", "安裝 eduHarness_Nooa", "從 Distribution 安裝 eduHarness", "建立 eduHarness Cloud 架構", "建立 Bootstrap Descriptor", "搬移 eduHarness Cloud", "修復 eduHarness Cloud bootstrap", "升級 eduHarness Cloud"]
      excludes: ["一般教案撰寫", "一般命題", "一般教材製作", "一般文獻查詢"]
    relations: {requires: [], enhances: [], routes: [], conflicts: [], replaces: [], supports: []}
    constraints: {human_gate_if: ["覆寫既有 Descriptor 或 ENV", "覆寫既有 Local Registry/Brain Index/Artifact Index", "批次搬移或刪除資料", "production upgrade"]}

  - id: github-to-cloud-skill-port
    namespace_id: "edu:github-to-cloud-skill-port"
    canonical_name: "GitHub → Cloud Skill 移植"
    artifact: {source: distribution, path: "00_ADMIN/SKILLS/_META/github-to-cloud-skill-port/SKILL.md"}
    metadata: {type: meta, role: primary-capability}
    selection:
      triggers: ["同步 GitHub skill", "移植 eduHarness skill", "更新 Cloud skill", "檢查 GitHub skill 是否有新版"]
      excludes: ["一般教案撰寫", "一般命題", "一般教材製作", "一般文獻查詢"]
    relations: {requires: [], enhances: [], routes: [], conflicts: [], replaces: [], supports: []}
    constraints: {human_gate_if: ["批次同步", "覆寫既有 Cloud Skill 的重大流程", "刪除或重新命名 Skill"]}

  - id: cloud-skill-builder
    namespace_id: "edu:cloud-skill-builder"
    canonical_name: "eduHarness Cloud Skill Builder"
    artifact: {source: distribution, path: "00_ADMIN/SKILLS/_META/cloud-skill-builder/SKILL.md"}
    metadata: {type: meta, role: primary-capability}
    selection:
      triggers: ["新增 eduHarness Cloud Skill", "建立 Cloud Skill", "修改 Cloud Skill", "擴充 Cloud Skill", "設計 Skill package", "Skill create vs extend", "Skill routing impact analysis"]
      excludes: ["同步 GitHub skill", "安裝 eduHarness Cloud", "升級 eduHarness Cloud", "一般教案撰寫", "一般命題", "一般教材製作", "一般文獻查詢"]
    relations: {requires: [], enhances: [], routes: [], conflicts: [], replaces: [], supports: ["edu:github-to-cloud-skill-port", "edu:cloud-bootstrap"]}
    constraints: {human_gate_if: ["新增或修改 Official Registry entry", "新增或修改 KeyPoint catalog", "新增或修改 Official route", "重大覆寫既有 Official Skill procedure", "刪除或重新命名 Official Skill", "發布 GitHub Canonical Distribution main", "任何可能破壞 routing 的治理修改"]}
    runtime: {chatgpt_web: "supported", gemini_spark: "supported"}
    source: {kind: "local-design", provenance: "CLOUD_SKILL_BUILDER_DEVELOPMENT_PLAN.md Draft 0.1 + validated Cloud production", upstream_version: "0.1.0"}
    cloud: {port_mode: "native-cloud", sync_status: "canonical"}

  - id: lesson-plan-authoring
    namespace_id: "edu:lesson-plan-authoring"

version: 2
name: "eduHarness Cloud Brain Index"

resolution_contract:
  installation_entry: "Bootstrap Descriptor"
  env_role: "installation config"
  provider: "artifact_index"
  rule: "Brain Index 保存 logical knowledge/memory references；若 Provider Ref 為 artifact://，必須經 Artifact Index 解析為實際 storage provider identity。Brain Index 不保存 installation-specific Notion/Dropbox/Drive locator。"

namespaces:
  curriculum:
    logical_ref: "brain://curriculum/index"
    provider_ref: "artifact://production/knowledge/curriculum/index"
    knowledge_type: "knowledge"
    load_policy: "on_demand"
    purpose: "教案設計時依領域與學習階段按需解析 curriculum index，再載入必要領域資料。"

categories:
  knowledge: "經驗證、可跨任務重用的教育知識與規則"
  template: "教案、評量、文件與輸出模板"
  experience: "已驗證、可重用的工作方法與判斷經驗"
  error_log: "已確認失敗、根因與 Do Not Repeat"
  shared_resource: "跨 Skill 共用且不屬於正式 knowledge 的資源"

meta_skills:
  - id: "edu:cloud-bootstrap"
    logical_role: "installation lifecycle"
    purpose: "以 Descriptor-first 流程初始化、安裝、搬移、升級或修復 eduHarness Cloud installation"
  - id: "edu:github-to-cloud-skill-port"
    logical_role: "canonical skill promotion/port"
    purpose: "從 GitHub Canonical Distribution 同步 Cloud Skill，經 Artifact Index 與實際 storage provider 安裝。"

index_rules:
  - "一般工作只載入與任務相關的 Brain namespace；不得預載全部 Knowledge。"
  - "Logical Ref 是 Brain identity；provider/path 不是 Brain identity。"
  - "新增 Skill 後正式 routing identity 以 Registry 為準；Skill binary/text artifact identity 由 Artifact Index 管理。"
  - "新增 knowledge/template/experience/error/shared resource 時才更新 Brain Index；實體 artifact locator 更新 Artifact Index。"
  - "搜尋到 logical ref 或檔名不代表已讀取內容；執行前仍需解析 Artifact Index 並實際讀取來源。"
  - "Runtime State 預設 ephemeral，不自動寫入 Brain。"
  - "Google Drive path 僅能作 optional provider path hint，不得作本 Index 的 root_source。"

schema_version: 1
manifest_kind: "eduHarness-distribution"
status: "stable"

distribution:
  id: "eduHarness_Nooa"
  name: "eduHarness_Nooa"
  edition: "cloud"
  version: "2026.08.12"
  channel: "stable"
  description: >
    eduHarness Cloud Canonical Distribution for ChatGPT Web / Gemini Spark.
    GitHub 是正式散布與功能演進來源；每位教師自己的 Google Drive 才是 runtime installation。

compatibility:
  project_kernel_version: "eduHarness Cloud v1.4.1 Compact Portable Kernel"
  project_instruction_upgrade_policy: "stable-unless-kernel-breaking-change"
  project_instructions_repaste_required_for_normal_upgrade: false
  installation_env_kind: "eduHarness-cloud"
  installation_edition: "cloud"
  registry_schema: 2
  routing_guard_contract_version: "2.1"
  runtime_targets: [chatgpt_web, gemini_spark]

installation:
  root_provisioning: "user-created"
  root_input: "teacher-provided-google-drive-url"
  installer_skill: "cloud-bootstrap"
  strategy: "reconstruct-from-manifest"
  existing_root_policy: "inspect-before-write"
  overwrite_policy: "human-gate"

upstream:
  source: "project-kernel"
  repository_field: "upstream.repository"
  branch_field: "upstream.branch"
  rule: "Canonical Distribution 從 Project Kernel 宣告的 GitHub upstream 解析；教師只提供自己的 Google Drive root。"

resources:
  install_guide: {type: file, source: "INSTALL.md", required: true, install_action: manual-read}
  upgrade_guide: {type: file, source: "docs/INSTALL_UPGRADE.md", required: true, install_action: manual-read}
  project_kernel:
    type: file
    source: "00_PROJECT_INSTRUCTIONS.yaml"
    required: true
    install_action: manual-project-instructions
    instruction: "首次安裝才需要把 Kernel 貼入 Project Instructions；一般 distribution upgrade 不要求重貼。"
  env_template: {type: file, source: "00_EDUHARNESS_ENV_TEMPLATE.yaml", required: true, install_action: generate-env}
  registry: {type: file, source: "00_ADMIN/00_EDU_SKILL_REGISTRY.yaml", destination: "00_ADMIN/00_EDU_SKILL_REGISTRY.yaml", required: true, install_action: copy}
  brain_index: {type: file, source: "00_ADMIN/01_BRAIN_INDEX.yaml", destination: "00_ADMIN/01_BRAIN_INDEX.yaml", required: true, install_action: copy}
  state_builder: {type: file, source: "00_ADMIN/REGISTRY_V2_1_RUNTIME_STATE_BUILDER.yaml", destination: "00_ADMIN/REGISTRY_V2_1_RUNTIME_STATE_BUILDER.yaml", required: true, install_action: copy}
  audit_trace_contract: {type: file, source: "00_ADMIN/REGISTRY_V2_1_RUNTIME_AUDIT_TRACE_CONTRACT.yaml", destination: "00_ADMIN/REGISTRY_V2_1_RUNTIME_AUDIT_TRACE_CONTRACT.yaml", required: true, install_action: copy}
  trace_adapter: {type: file, source: "00_ADMIN/REGISTRY_V2_1_RUNTIME_TRACE_ADAPTER.yaml", destination: "00_ADMIN/REGISTRY_V2_1_RUNTIME_TRACE_ADAPTER.yaml", required: true, install_action: copy}
  skills: {type: folder, source: "00_ADMIN/SKILLS", destination: "00_ADMIN/SKILLS", required: true, install_action: reconstruct}
  knowledge_base: {type: folder, destination: "10_KNOWLEDGE_BASE", required: true, install_action: create}
  templates: {type: folder, destination: "20_TEMPLATES", required: true, install_action: create}
  experience: {type: folder, destination: "30_EXPERIENCE", required: true, install_action: create}
  error_log: {type: folder, destination: "40_ERROR_LOG", required: true, install_action: create}
  work_area: {type: folder, destination: "50_WORKSPACE", required: true, install_action: create}
  shared_resources: {type: folder, destination: "80_SHARED_RESOURCES", required: true, install_action: create}
  output: {type: folder, destination: "90_OUTPUT", required: true, install_action: create}
  review_later: {type: folder, destination: "98_REVIEW_LATER", required: true, install_action: create}
  archive: {type: folder, destination: "99_ARCHIVE", required: true, install_action: create}

env_generation:
  output_file: "00_EDUHARNESS_ENV.yaml"
  env_kind: "eduHarness-cloud"
  resolve: {drive_root: installed-root}
  rule: "正式 ENV 必須在教師自己的 installation 產生；不得複製其他人的正式 ENV。"

upgrade_contract:
  normal_upgrade_requires_project_instruction_repaste: false
  detect:
    - "read local formal ENV"
    - "read local Registry/runtime contracts"
    - "read canonical Distribution Manifest"
  preflight:
    - "target Registry schema is supported by active Project Kernel"
    - "all required distribution resources are readable"
    - "destination installation is uniquely resolved and writable"
  snapshot:
    required_before_replace: true
    destination: "ENV.workspace.work_area"
    scope: [registry, runtime_contracts, managed_skill_packages]
  preserve:
    - "00_EDUHARNESS_ENV.yaml"
    - "01_BRAIN_INDEX.yaml unless explicit schema migration is required"
    - "10_KNOWLEDGE_BASE"
    - "20_TEMPLATES user content"
    - "30_EXPERIENCE"
    - "40_ERROR_LOG"
    - "50_WORKSPACE"
    - "80_SHARED_RESOURCES"
    - "90_OUTPUT"
    - "98_REVIEW_LATER"
    - "99_ARCHIVE"
  replace_after_snapshot:
    - "00_ADMIN/00_EDU_SKILL_REGISTRY.yaml"
    - "00_ADMIN/REGISTRY_V2_1_RUNTIME_STATE_BUILDER.yaml"
    - "00_ADMIN/REGISTRY_V2_1_RUNTIME_AUDIT_TRACE_CONTRACT.yaml"
    - "00_ADMIN/REGISTRY_V2_1_RUNTIME_TRACE_ADAPTER.yaml"
    - "distribution-managed Skill packages"
  verify:
    - "fresh bootstrap from unchanged local ENV"
    - "Registry schema=2 and routing guard contract=2.1"
    - "all Registry Skill targets resolve"
    - "State Builder and observability references resolve"
    - "no installation-specific locator leaked from Distribution"
  rollback:
    trigger: "any verification failure"
    action: "restore only managed resources from snapshot; preserve ENV and user data"
  human_gate:
    required_before: ["replace managed production files", "bulk Skill package overwrite", "rollback overwrite"]

distribution_privacy:
  never_distribute:
    - "installation-specific Drive URLs or IDs"
    - "formal ENV from another installation"
    - "student PII or identifiable learning records"
    - "secrets, tokens, cookies, credentials or private keys"
    - "private Brain content, working traces or teacher outputs"

verification:
  required:
    - "installed_env_exists"
    - "installed_env_schema_valid"
    - "installed_env_points_to_local_root"
    - "registry_readable"
    - "registry_schema_2"
    - "routing_guard_contract_2_1"
    - "state_builder_readable"
    - "audit_trace_contract_readable"
    - "trace_adapter_readable"
    - "brain_index_readable"
    - "skills_root_accessible"
    - "installed_cloud_skills_count_17"
    - "skill_folder_subresources_preserved"
    - "no_multiple_runtime_env_anchors"
    - "no_installation_specific_drive_locator_outside_env"
  ready_state: "INSTALLATION_READY"

failure:
  distribution_not_found: "DISTRIBUTION_NOT_FOUND"
  distribution_invalid: "DISTRIBUTION_INVALID"
  source_missing: "SOURCE_UNAVAILABLE"
  runtime_incompatible: "RUNTIME_INCOMPATIBLE"
  install_root_exists: "INSTALL_ROOT_EXISTS"
  env_ambiguous: "ENV_AMBIGUOUS"
  env_generation_failed: "INSTALL_ENV_GENERATION_FAILED"
  env_invalid: "INSTALL_ENV_INVALID"
  registry_unavailable: "EDU_REGISTRY_UNAVAILABLE"
  brain_index_unavailable: "BRAIN_INDEX_UNAVAILABLE"
  write_failed: "SAVE_FAILED"
  skill_package_incomplete: "SKILL_PACKAGE_INCOMPLETE"
  verification_failed: "SAVE_UNVERIFIED"

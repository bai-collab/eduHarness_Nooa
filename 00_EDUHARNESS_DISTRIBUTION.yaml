schema_version: 3
manifest_kind: "eduHarness-distribution"
status: "candidate"

distribution:
  id: "eduHarness_Nooa"
  name: "eduHarness_Nooa"
  edition: "cloud"
  version: "2026.08.13-registry-v3-candidate"
  architecture_revision: "v0.3-candidate"
  channel: "candidate"
  description: >
    eduHarness Cloud Registry v3 candidate for ChatGPT Web / Gemini Spark.
    GitHub provides Official Registry/Official Skills from an immutable distribution snapshot;
    Teacher installations own Local Registry, Brain Index, Artifact Index and Storage resources.

candidate_dependencies:
  official_registry_v3:
    source: "00_ADMIN/00_EDU_SKILL_REGISTRY.yaml"
    required_schema: 3
    current_candidate_state: "pending"
    blocking: true
    rule: "Phase 3 bootstrap MUST NOT declare executable/ready until the pinned Official Registry file itself validates as schema 3."
  project_kernel_registry_v3_support:
    required: true
    current_candidate_state: "pending"
    blocking_for_production: true
    rule: "Current production Kernel supports Registry schema 1/2 only; schema 3 promotion requires coordinated Kernel migration and Human Gate."

compatibility:
  project_kernel_version_required: "registry-schema-3-capable"
  project_instruction_upgrade_policy: "kernel-breaking-change-requires-migration"
  project_instructions_repaste_required_for_v3_cutover: true
  installation_env_kind: "eduHarness-cloud"
  installation_edition: "cloud"
  env_schema: 3
  official_registry_schema: 3
  local_registry_schema: 1
  local_overlay_contract_version: 1
  routing_guard_contract_version: "2.1"
  runtime_targets: [chatgpt_web, gemini_spark]

architecture:
  installation_entry: "bootstrap_descriptor"
  env_role: "installation_config"
  official_registry_role: "canonical_distribution_routing"
  local_registry_role: "installation_routing_overlay"
  effective_routing_view: "runtime_ephemeral"
  brain_index_role: "knowledge_memory_logical_index"
  artifact_index_role: "installation_owned_artifact_resolution"
  runtime_state: "ephemeral"
  default_control_plane: "notion"
  default_storage_provider: "dropbox"
  optional_storage_providers: [google_drive]
  provider_rule: "Default providers are distribution defaults, not Kernel-global hard dependencies. Resolve actual installation providers from Descriptor/ENV."

installation:
  strategy: "descriptor-first-dual-registry"
  bootstrap_skill: "cloud-bootstrap"
  provider_profile_default: "notion+dropbox"
  preexisting_installation_policy: "inspect-before-write"
  overwrite_policy: "human-gate"
  google_drive_root_required: false
  official_skill_installation_mirror_required: false
  official_registry_installation_copy_required: false
  local_registry_required: true
  model_regeneration_as_transport_allowed: false

upstream:
  source: "project-kernel"
  repository_field: "upstream.repository"
  branch_field: "upstream.branch"
  snapshot_policy: "resolve branch to immutable commit before loading Official Registry/Skill/Knowledge"
  rule: "Official Distribution 從 Project Kernel 宣告的 GitHub upstream 解析；一次 execution 內 Official Registry/Skill/Knowledge 必須使用同一 immutable commit snapshot。"

canonical_contracts:
  bootstrap_descriptor: {source: "docs/BOOTSTRAP_DESCRIPTOR_CONTRACT.md", required: true}
  registry_v3_dual_layer: {source: "docs/REGISTRY_V3_DUAL_LAYER_CONTRACT.md", required: true}
  local_registry: {source: "docs/LOCAL_REGISTRY_CONTRACT.md", required: true}
  control_plane: {source: "docs/CONTROL_PLANE_CONTRACT.md", required: true}
  storage_adapter: {source: "docs/STORAGE_ADAPTER_CONTRACT.md", required: true}
  runtime_state: {source: "docs/RUNTIME_STATE_CONTRACT.md", required: true}

resources:
  install_guide: {type: file, source: "INSTALL.md", required: true}
  upgrade_guide: {type: file, source: "docs/INSTALL_UPGRADE.md", required: true}
  project_kernel: {type: file, source: "00_PROJECT_INSTRUCTIONS.yaml", required: true}
  env_template: {type: file, source: "00_EDUHARNESS_ENV_TEMPLATE.yaml", required: true}
  official_registry: {type: canonical_distribution_resource, source: "00_ADMIN/00_EDU_SKILL_REGISTRY.yaml", required: true, ownership: "official"}
  local_registry_template: {type: installation_template, source: "00_ADMIN/LOCAL_REGISTRY_TEMPLATE.yaml", required: true, ownership: "installation"}
  resolver_fixtures: {type: regression_fixture, source: "00_ADMIN/REGISTRY_V3_RESOLVER_FIXTURES.yaml", required: true}
  brain_index: {type: installation_control_plane_resource, required: true}
  artifact_index: {type: installation_control_plane_resource, required: true}
  bootstrap_descriptor: {type: installation_entry_resource, required: true}
  official_skills: {type: canonical_distribution_artifacts, source: "00_ADMIN/SKILLS", required: true, ownership: "official", loading: "on_demand"}
  curriculum_standards: {type: canonical_distribution_knowledge, source: "10_KNOWLEDGE_BASE/課綱_各領域", required: true, ownership: "official", loading: "on_demand-relevant-domain-only"}

bootstrap_contract:
  sequence:
    - "resolve canonical Distribution"
    - "pin immutable distribution snapshot"
    - "verify Official Registry source itself is schema 3; otherwise stop"
    - "resolve or create installation Bootstrap Descriptor"
    - "resolve formal ENV from Descriptor"
    - "resolve installation Control Plane and Storage providers from ENV"
    - "create/resolve Local Registry, Brain Index and Artifact Index"
    - "verify artifacts/output/work_area"
    - "read Official Registry from pinned snapshot"
    - "validate Official Registry and Local Registry independently"
    - "build and validate ephemeral Effective Routing View"
    - "resolve Official Skills directly from pinned snapshot on demand"
    - "resolve Local Skills through Local Registry -> Artifact Index -> installation Storage"
    - "fresh-start bootstrap from Descriptor"
  completion: "INSTALLATION_READY"

artifact_resolution:
  official_rule: "Official Registry/Skill/Knowledge resolve directly from the pinned Canonical Distribution snapshot and do not require installation Artifact Index mirrors."
  local_rule: "Local Registry/Brain installation-owned refs resolve through artifact:// -> Artifact Index -> provider stable identity/revision/path hint."
  local_required_fields: [artifact_id, provider, identity_type, identity_value, identity_strength, status]
  revision_readback: "required when provider exposes revisions for installation-owned artifacts"

artifact_transfer_contract:
  fresh_install_official_scope: "none"
  applies_to:
    - "installation-owned Local Skill/Knowledge artifacts written to Storage"
    - "explicit legacy migration/import where byte-preserving canonical equivalence is required"
  source_identity_required_when_canonical_transfer: true
  deterministic_transfer_required_when_canonical_transfer: true
  destination_content_readback_required_when_canonical_transfer: true
  model_regeneration_as_transport_allowed: false

upgrade_contract:
  v2_to_v3:
    source_model_change: true
    preserve:
      - "Bootstrap Descriptor identity unless migration requires update"
      - "existing ENV until replacement ENV v3 verifies"
      - "Brain Index user-owned entries"
      - "Artifact Index user-owned entries"
      - "all user-owned knowledge/templates/experience/error logs/output"
      - "existing v2 Official Skill Dropbox mirrors as non-authoritative legacy cache/rollback evidence"
    create:
      - "Local Registry"
      - "ENV v3 local_registry locator"
    switch_authority:
      official_registry: "installation copy -> pinned GitHub Official Registry"
      official_skills: "Dropbox mirrors -> pinned GitHub Official Skills"
    delete_during_initial_cutover: []
    human_gate_required: true
    verify:
      - "Kernel supports Registry schema 3"
      - "immutable distribution snapshot resolves"
      - "Official Registry source itself is schema 3"
      - "Official Registry schema 3 validates"
      - "Local Registry schema 1 validates"
      - "Effective Routing View passes resolver fixtures/graph validation"
      - "Official Skill full text is readable from pinned snapshot"
      - "Local artifact refs resolve through installation Artifact Index"
      - "fresh bootstrap from Descriptor succeeds"
    rollback: "retain v2 resources and restore v2 ENV/Registry authority if v3 verification fails"

distribution_privacy:
  never_distribute:
    - "installation-specific Notion page/database IDs"
    - "installation-specific Dropbox stable IDs or paths"
    - "installation-specific Google Drive URLs or IDs"
    - "formal ENV, Local Registry, Artifact Index or Bootstrap Descriptor from another installation"
    - "student PII or identifiable learning records"
    - "secrets, tokens, cookies, credentials or private keys"
    - "private Brain content, working traces or teacher outputs"

verification:
  required:
    - "registry_v3_dual_layer_contract_readable"
    - "local_registry_contract_readable"
    - "env_schema_3_provider_neutral"
    - "official_registry_source_schema_3"
    - "official_registry_remote_snapshot_model"
    - "local_registry_installation_model"
    - "effective_routing_view_ephemeral"
    - "official_skill_installation_mirror_not_required"
    - "typed_relations_and_guard_contract_preserved"
    - "artifact_index_scoped_to_installation_owned_artifacts"
    - "human_gate_preserved"
    - "failure_contract_preserved"
    - "google_drive_not_required_for_installation"
    - "no_installation_specific_locator_in_canonical_kernel_or_distribution"
  ready_state: "BLOCKED_PENDING_OFFICIAL_REGISTRY_V3_AND_KERNEL_SUPPORT"

failure:
  descriptor_not_found: "EDUHARNESS_DESCRIPTOR_NOT_FOUND"
  descriptor_invalid: "EDUHARNESS_DESCRIPTOR_INVALID"
  distribution_not_found: "DISTRIBUTION_NOT_FOUND"
  distribution_invalid: "DISTRIBUTION_INVALID"
  source_missing: "SOURCE_UNAVAILABLE"
  source_conflict: "SOURCE_CONFLICT"
  runtime_incompatible: "RUNTIME_INCOMPATIBLE"
  env_ambiguous: "ENV_AMBIGUOUS"
  env_generation_failed: "INSTALL_ENV_GENERATION_FAILED"
  env_invalid: "INSTALL_ENV_INVALID"
  official_registry_unavailable: "EDU_REGISTRY_UNAVAILABLE"
  local_registry_invalid: "LOCAL_REGISTRY_INVALID"
  brain_index_unavailable: "BRAIN_INDEX_UNAVAILABLE"
  artifact_index_unavailable: "ARTIFACT_INDEX_UNAVAILABLE"
  artifact_unresolved: "ARTIFACT_UNRESOLVED"
  graph_invalid: "REGISTRY_GRAPH_INVALID"
  skill_unavailable: "SKILL_UNAVAILABLE"
  write_failed: "SAVE_FAILED"
  verification_failed: "SAVE_UNVERIFIED"

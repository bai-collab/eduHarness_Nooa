schema_version: 2
manifest_kind: "eduHarness-distribution"
status: "stable"

distribution:
  id: "eduHarness_Nooa"
  name: "eduHarness_Nooa"
  edition: "cloud"
  version: "2026.08.13"
  architecture_revision: "v0.2"
  channel: "stable"
  description: >
    eduHarness Cloud Canonical Distribution for ChatGPT Web / Gemini Spark.
    GitHub 是 Canonical Distribution；Bootstrap Descriptor 是 installation entry；
    Notion 是 default Control Plane；Dropbox 是 default Storage Provider；Google Drive 為 optional/legacy storage provider。

compatibility:
  project_kernel_version: "eduHarness Cloud v2.0.0 Compact Portable Kernel"
  previous_kernel_version: "eduHarness Cloud v1.4.1 Compact Portable Kernel"
  project_instruction_upgrade_policy: "kernel-breaking-change-requires-migration"
  project_instructions_repaste_required_for_normal_upgrade: false
  project_instructions_repaste_required_for_v2_cutover: true
  installation_env_kind: "eduHarness-cloud"
  installation_edition: "cloud"
  env_schema: 2
  registry_schema: 2
  routing_guard_contract_version: "2.1"
  runtime_targets: [chatgpt_web, gemini_spark]

architecture:
  installation_entry: "bootstrap_descriptor"
  env_role: "installation_config"
  registry_role: "capability_routing"
  brain_index_role: "knowledge_memory_logical_index"
  artifact_index_role: "logical_artifact_resolution"
  runtime_state: "ephemeral"
  default_control_plane: "notion"
  default_storage_provider: "dropbox"
  optional_storage_providers: [google_drive]
  provider_rule: "Default providers are distribution defaults, not Kernel-global hard dependencies. Resolve actual providers from Descriptor/ENV."

installation:
  strategy: "descriptor-first"
  bootstrap_skill: "cloud-bootstrap"
  provider_profile_default: "notion+dropbox"
  preexisting_installation_policy: "inspect-before-write"
  overwrite_policy: "human-gate"
  google_drive_root_required: false
  managed_artifact_transfer_policy: "deterministic-and-canonical-equivalence-verified"
  model_regeneration_as_transport_allowed: false

upstream:
  source: "project-kernel"
  repository_field: "upstream.repository"
  branch_field: "upstream.branch"
  rule: "Canonical Distribution 從 Project Kernel 宣告的 GitHub upstream 解析；不得要求教師提供 GitHub distribution locator。"

canonical_contracts:
  bootstrap_descriptor: {source: "docs/BOOTSTRAP_DESCRIPTOR_CONTRACT.md", required: true}
  control_plane: {source: "docs/CONTROL_PLANE_CONTRACT.md", required: true}
  storage_adapter: {source: "docs/STORAGE_ADAPTER_CONTRACT.md", required: true}
  runtime_state: {source: "docs/RUNTIME_STATE_CONTRACT.md", required: true}
  production_readiness: {source: "docs/PRODUCTION_READINESS.md", required: true}
  master_plan: {source: "docs/EDUHARNESS_CLOUD_V0_2_MASTER_PLAN.md", required: true}

resources:
  install_guide: {type: file, source: "INSTALL.md", required: true}
  upgrade_guide: {type: file, source: "docs/INSTALL_UPGRADE.md", required: true}
  project_kernel: {type: file, source: "00_PROJECT_INSTRUCTIONS.yaml", required: true}
  env_template: {type: file, source: "00_EDUHARNESS_ENV_TEMPLATE.yaml", required: true}
  registry: {type: logical_control_plane_resource, source: "00_ADMIN/00_EDU_SKILL_REGISTRY.yaml", required: true}
  brain_index: {type: logical_control_plane_resource, source: "00_ADMIN/01_BRAIN_INDEX.yaml", required: true}
  artifact_index: {type: installation_control_plane_resource, required: true}
  bootstrap_descriptor: {type: installation_entry_resource, required: true}
  skills: {type: logical_artifacts, source: "00_ADMIN/SKILLS", required: true}
  curriculum_standards:
    type: logical_knowledge_artifacts
    source: "10_KNOWLEDGE_BASE/課綱_各領域"
    required: true
    ownership: "distribution-managed"
    loading: "on-demand-relevant-domain-only"

artifact_transfer_contract:
  scope: "all distribution-managed Skill and Knowledge artifacts"
  source_identity_required: true
  source_content_evidence_required: true
  deterministic_transfer_required: true
  destination_content_readback_required: true
  canonical_equivalence_required: true
  stable_identity_readback_required_when_supported: true
  revision_readback_required_when_supported: true
  verified_binding_before_equivalence_allowed: false
  forbidden_fallbacks:
    - "model paraphrase/regeneration/manual reconstruction used as transport"
    - "write-success-only verification"
    - "size-only or visual-similarity-only equivalence"
  failure:
    source_evidence_unavailable: "SOURCE_UNAVAILABLE"
    transfer_path_unavailable: "RUNTIME_INCOMPATIBLE"
    write_failed: "SAVE_FAILED"
    equivalence_unverified: "SAVE_UNVERIFIED"

bootstrap_contract:
  sequence:
    - "resolve canonical Distribution"
    - "resolve or create installation Bootstrap Descriptor"
    - "resolve formal ENV from Descriptor"
    - "resolve Control Plane and Storage providers from ENV"
    - "resolve Registry / Brain Index / Artifact Index"
    - "preflight deterministic verified artifact transfer capability"
    - "install distribution-managed artifacts"
    - "verify destination canonical equivalence before verified Artifact Index binding"
    - "resolve logical Skill/Knowledge artifacts through Artifact Index"
    - "verify provider stable identity and revision when supported"
    - "verify storage artifacts/output/work_area"
    - "fresh-start bootstrap from Descriptor"
  completion: "INSTALLATION_READY"

artifact_resolution:
  rule: "Registry/Brain records SHOULD point to logical artifact:// references. Artifact Index resolves logical IDs to provider identity. Stable provider identity is authoritative over path when available."
  required_fields: [artifact_id, provider, identity_type, identity_value, identity_strength, status]
  revision_readback: "required when provider exposes revisions"
  verified_binding_rule: "distribution-managed artifact status may be verified only after canonical-equivalence verification passes"

upgrade_contract:
  detect:
    - "read current Bootstrap Descriptor"
    - "read formal ENV"
    - "read current Registry / Brain Index / Artifact Index"
    - "read canonical Distribution Manifest"
  preflight:
    - "target schemas supported by active Project Kernel"
    - "required canonical contracts readable"
    - "actual Control Plane and Storage providers are resolvable with current tools/ACL"
    - "all mutation targets uniquely resolved"
    - "all managed artifact mutations have deterministic canonical-equivalence-verifiable transfer path"
  preserve:
    - "installation-specific Bootstrap Descriptor locator unless migration explicitly requires replacement"
    - "formal ENV unless migration explicitly requires schema conversion"
    - "user-owned knowledge / experience / error logs / templates / outputs"
    - "runtime state (ephemeral; never promoted as a managed artifact)"
  managed:
    - "Registry canonical semantics"
    - "Distribution-managed Skill logical artifacts"
    - "Distribution-managed curriculum logical artifacts"
    - "declared Brain Index additive migrations"
    - "declared Artifact Index mappings"
  human_gate:
    required_before: ["production control-plane mutation", "managed artifact overwrite", "Brain Index migration", "Artifact Index remap", "rollback overwrite", "canonical distribution promotion"]
  verify:
    - "fresh bootstrap from Descriptor"
    - "ENV schema/config valid"
    - "Registry schema=2 and typed relations preserved"
    - "Brain Index logical refs resolve"
    - "Artifact Index logical refs resolve to provider identities"
    - "required Skill/Knowledge artifacts read back"
    - "distribution-managed artifact canonical equivalence passes"
    - "stable identity/revision read-back passes when supported"
    - "storage artifacts/output/work_area resolve"
    - "no installation-specific locator leaked into Kernel/Distribution"
  rollback:
    trigger: "any verification failure"
    action: "use provider/control-plane adapter recovery; restore only affected managed resources; preserve user-owned data and re-run fresh bootstrap"

distribution_privacy:
  never_distribute:
    - "installation-specific Notion page/database IDs"
    - "installation-specific Dropbox stable IDs or paths"
    - "installation-specific Google Drive URLs or IDs"
    - "formal ENV or Bootstrap Descriptor from another installation"
    - "student PII or identifiable learning records"
    - "secrets, tokens, cookies, credentials or private keys"
    - "private Brain content, working traces or teacher outputs"

verification:
  required:
    - "descriptor_contract_readable"
    - "env_template_provider_neutral"
    - "registry_schema_2"
    - "registry_typed_relations_preserved"
    - "brain_artifact_layering_supported"
    - "artifact_index_required"
    - "managed_artifact_transfer_preflight_required"
    - "managed_artifact_canonical_equivalence_required"
    - "model_regeneration_not_accepted_as_transport"
    - "runtime_state_ephemeral"
    - "human_gate_preserved"
    - "failure_contract_preserved"
    - "google_drive_not_required_for_installation"
    - "no_installation_specific_locator_in_canonical_kernel_or_distribution"
  ready_state: "CANONICAL_DISTRIBUTION_READY"

failure:
  descriptor_not_found: "EDUHARNESS_DESCRIPTOR_NOT_FOUND"
  descriptor_invalid: "EDUHARNESS_DESCRIPTOR_INVALID"
  distribution_not_found: "DISTRIBUTION_NOT_FOUND"
  distribution_invalid: "DISTRIBUTION_INVALID"
  source_missing: "SOURCE_UNAVAILABLE"
  runtime_incompatible: "RUNTIME_INCOMPATIBLE"
  env_ambiguous: "ENV_AMBIGUOUS"
  env_generation_failed: "INSTALL_ENV_GENERATION_FAILED"
  env_invalid: "INSTALL_ENV_INVALID"
  registry_unavailable: "EDU_REGISTRY_UNAVAILABLE"
  brain_index_unavailable: "BRAIN_INDEX_UNAVAILABLE"
  artifact_index_unavailable: "ARTIFACT_INDEX_UNAVAILABLE"
  artifact_unresolved: "ARTIFACT_UNRESOLVED"
  brain_index_migration_failed: "BRAIN_INDEX_MIGRATION_FAILED"
  write_failed: "SAVE_FAILED"
  verification_failed: "SAVE_UNVERIFIED"

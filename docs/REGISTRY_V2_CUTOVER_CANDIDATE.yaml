validation_expectations:
  unique_namespace: true
  all_relation_targets_exist: true
  requires_acyclic: true
  replacement_acyclic: true
  hard_relation_conflicts_absent: true
  route_evaluation_values_valid: true
  route_cycles_allowed_with_loop_protection: true

cutover_notes:
  - "Candidate only; runtime_ssot remains false until final cutover Human Gate and Cloud installation verification."
  - "conjecturing-five-stage → reasoning-kernel is adjudicated as enhances[reasoning_policy.activation]."
  - "all currently declared routes are entry-evaluable from task/input state and are explicitly marked evaluation=entry."
  - "omitted route evaluation defaults to post_execution for future routes and backward-safe behavior."

schema_version: 2
registry: "eduHarness Cloud Skill Registry"
namespace: "edu"
edition: "cloud"
status: "cutover-candidate"
runtime_ssot: false
based_on:
  file: "00_ADMIN/00_EDU_SKILL_REGISTRY.yaml"
  schema_version: 1
  skill_count: 16

runtime_targets:
  - chatgpt_web
  - gemini_spark

graph_policy:
  canonical_reference:
    field: namespace_id
  requires:
    cycle_allowed: false
    missing_target_action: stop
  routing:
    cycle_allowed: conditional
    max_route_hops: 5
    repeated_node_state_action: stop
    omitted_evaluation_default: post_execution
  conflicts:
    simultaneous_activation: forbidden
  supports:
    auto_load: false
  replaces:
    replacement_cycle_allowed: false

reasoning_policy:
  mode: conditional
  kernel_skill: "edu:reasoning-kernel"
  activation:
    - "存在兩個以上合理假設、方案或解釋，需要區分"
    - "來源衝突、證據強度不同或關鍵資訊不完整"
    - "診斷、除錯、研究、策略、因果判斷或高成本決策"
    - "需要反例、測試、實驗或查證才能提高信心"
  bypass:
    - "單純抄錄、翻譯、格式轉換或明確規則下的機械操作"
    - "單一可靠來源即可回答的簡單事實查詢"

skills:
  - id: "cloud-bootstrap"
    namespace_id: "edu:cloud-bootstrap"
    canonical_name: "eduHarness Cloud 初始化"
    file: "00_ADMIN/SKILLS/_META/cloud-bootstrap/SKILL.md"
    metadata: {type: meta, role: primary-capability, purpose: "初始化、安裝、搬移或修復 eduHarness Cloud installation。"}
    selection:
      triggers: ["初始化 eduHarness Cloud", "安裝 eduHarness Cloud", "安裝 eduHarness_Nooa", "從 Distribution 安裝 eduHarness", "建立 eduHarness Cloud 架構", "依模板建立 ENV", "搬移 eduHarness Cloud", "修復 eduHarness Cloud bootstrap"]
      excludes: ["一般教案撰寫", "一般命題", "一般教材製作", "一般文獻查詢"]
    relations: {requires: [], enhances: [], routes: [], conflicts: [], replaces: [], supports: []}
    constraints: {human_gate_if: ["覆寫既有 ENV", "覆寫既有 Registry 或 Brain Index", "批次搬移或刪除資料"]}

  - id: "github-to-cloud-skill-port"
    namespace_id: "edu:github-to-cloud-skill-port"
    canonical_name: "GitHub → Cloud Skill 移植"
    file: "00_ADMIN/SKILLS/_META/github-to-cloud-skill-port/SKILL.md"
    metadata: {type: meta, role: primary-capability, purpose: "同步或移植指定 Skill 到 Cloud Edition 並做 runtime 適配。"}
    selection:
      triggers: ["同步 GitHub skill", "複製 GitHub skill 到 Drive", "移植 eduHarness skill", "更新 Cloud skill", "檢查 GitHub skill 是否有新版"]
      excludes: ["一般教案撰寫", "一般命題", "一般教材製作", "一般文獻查詢"]
    relations: {requires: [], enhances: [], routes: [], conflicts: [], replaces: [], supports: []}
    constraints: {human_gate_if: ["批次同步", "覆寫既有 Cloud Skill 的重大流程", "刪除或重新命名 Skill"]}

  - id: "lesson-plan-authoring"
